<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style2.css">
    <title>Форма_Бобровская</title>
</head>
<body>
    <a href="index.html" class="in1">Страница 1</a>
    <a href="index2.html" class="in1">Страница 2</a>
    <main class="container">
        <h1 class="container_h1">Узнать цену и забронировать машину</h1>
    <div class="form">
        <form action="">
            <input type="text" class="text" placeholder="Ваше имя" required>
            <input type="email" class="email" placeholder="Ваш email" required>
            <input type="number" class="number" placeholder="Ваш номер" required>
            <select class="select">
                <option value="0">Какой автомобиль</option>
                <option value="1">машина 1</option>
                <option value="2">машина 2</option>
            </select>
            <input type="number" class="number" placeholder="Дата бронирования" required>
            <input type="number" class="number" placeholder="На сколько" required>
            <textarea placeholder="Дополнительный текст" class="button_bb"></textarea>
            <button type="submit" class="form_button">Узнать цену</button>
        </form>
    </div>
    </main>
</body>
</html>
